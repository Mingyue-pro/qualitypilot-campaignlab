spring.application.name=CampaignLab
spring.datasource.url=${CAMPAIGNLAB_DB_URL:jdbc:mysql://localhost:3306/campaignlab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${CAMPAIGNLAB_DB_USERNAME:campaignlab}
spring.datasource.password=${CAMPAIGNLAB_DB_PASSWORD:campaignlab}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.web.error.include-message=always
campaignlab.frontend.origins=${CAMPAIGNLAB_FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
